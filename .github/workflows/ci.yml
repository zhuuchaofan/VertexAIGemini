name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore VertexAI/VertexAI.csproj

      - name: Restore tests
        run: dotnet restore VertexAI.Tests/VertexAI.Tests.csproj

      - name: Build API
        run: dotnet build VertexAI/VertexAI.csproj --no-restore --disable-build-servers

      - name: Build tests
        run: dotnet build VertexAI.Tests/VertexAI.Tests.csproj --no-restore --disable-build-servers

      - name: Run service tests
        run: dotnet run --project VertexAI.Tests/VertexAI.Tests.csproj --no-build

  api-firestore-emulator:
    # Runs the whole API test suite against the Firestore emulator so the run-lifecycle contract tests
    # (single-winner admission, compare-and-set finalization, lease fencing) are not skipped.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build tests
        run: |
          dotnet restore VertexAI.Tests/VertexAI.Tests.csproj
          dotnet build VertexAI.Tests/VertexAI.Tests.csproj --no-restore --disable-build-servers

      - name: Run service tests against the Firestore emulator
        run: >
          npx --yes firebase-tools@14 emulators:exec
          --only firestore
          --project demo-contract-tests
          --config VertexAI.Tests/firebase.emulator.json
          "dotnet run --project VertexAI.Tests/VertexAI.Tests.csproj --no-build"

  web-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run web proxy and legacy UI tests
        working-directory: apps/web
        run: npm test

  web-client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web/client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/client/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # The whole chain in a real browser: Playwright -> Node proxy -> API (mock model, fake dev user) -> Firestore
    # emulator. Covers send, stream, stop, a closed tab, a reload mid-stream, a double click and a busy conversation.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/client/package-lock.json

      - name: Build the API
        run: |
          dotnet restore VertexAI/VertexAI.csproj
          dotnet build VertexAI/VertexAI.csproj --no-restore --disable-build-servers

      - name: Install client dependencies and the browser
        working-directory: apps/web/client
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        working-directory: apps/web/client
        run: npm run e2e

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/client/test-results
          if-no-files-found: ignore

  deploy-scripts:
    # Offline contract tests for the deployment scripts: they run against a fake gcloud and change nothing.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n scripts/deploy-cloud-run.sh
          bash -n scripts/release-cloud-shell.sh
          bash -n scripts/container-smoke.sh

      - name: Deploy script tests
        run: python3 scripts/test-deploy-cloud-run.py

      - name: Cloud Shell release script tests
        run: python3 scripts/test-release-cloud-shell.py

  containers:
    # The same Dockerfiles the deployment builds, run for real behind a Firestore emulator. Builds only, never pushes or deploys.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build API image
        run: docker build --tag vertex-ai-api:ci VertexAI

      - name: Build web image
        run: docker build --tag vertex-ai-web:ci apps/web

      - name: Smoke test both images
        run: >
          npx --yes firebase-tools@14 emulators:exec
          --only firestore
          --project demo-smoke
          --config VertexAI.Tests/firebase.emulator.json
          "scripts/container-smoke.sh vertex-ai-api:ci vertex-ai-web:ci"
