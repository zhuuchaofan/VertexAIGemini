name: Deploy Cloud Run

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Service to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - web

permissions:
  contents: read
  id-token: write

env:
  DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'all' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-east1' }}
  REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'vertex-ai' }}
  API_SERVICE: ${{ vars.API_SERVICE || 'vertex-ai-api' }}
  WEB_SERVICE: ${{ vars.WEB_SERVICE || 'vertex-ai-web' }}
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
  DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}
  WEB_SERVICE_ACCOUNT: ${{ vars.WEB_SERVICE_ACCOUNT || vars.WEB_INVOKER_SERVICE_ACCOUNT || vars.CLOUD_RUN_SERVICE_ACCOUNT }}
  WEB_INVOKER_SERVICE_ACCOUNT: ${{ vars.WEB_INVOKER_SERVICE_ACCOUNT || vars.WEB_SERVICE_ACCOUNT || vars.CLOUD_RUN_SERVICE_ACCOUNT }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || vars.GCP_PROJECT_ID }}
  FIRESTORE_PROJECT_ID: ${{ vars.FIRESTORE_PROJECT_ID || vars.FIREBASE_PROJECT_ID || vars.GCP_PROJECT_ID }}
  FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
  DEFAULT_PROVIDER_ID: ${{ vars.DEFAULT_PROVIDER_ID || 'gemini' }}
  ATTACHMENT_STORAGE_BUCKET: ${{ vars.ATTACHMENT_STORAGE_BUCKET || format('{0}-vertex-ai-attachments', vars.GCP_PROJECT_ID) }}
  ATTACHMENT_STORAGE_ROLE: ${{ vars.ATTACHMENT_STORAGE_ROLE || format('projects/{0}/roles/vertexAiAttachmentObjectUser', vars.GCP_PROJECT_ID) }}
  API_CPU: ${{ vars.API_CPU || '1' }}
  API_MEMORY: ${{ vars.API_MEMORY || '1Gi' }}
  API_CONCURRENCY: ${{ vars.API_CONCURRENCY || '20' }}
  API_TIMEOUT: ${{ vars.API_TIMEOUT || '300s' }}
  API_MIN_INSTANCES: ${{ vars.API_MIN_INSTANCES || '0' }}
  API_MAX_INSTANCES: ${{ vars.API_MAX_INSTANCES || '3' }}
  WEB_CPU: ${{ vars.WEB_CPU || '1' }}
  WEB_MEMORY: ${{ vars.WEB_MEMORY || '512Mi' }}
  WEB_CONCURRENCY: ${{ vars.WEB_CONCURRENCY || '80' }}
  WEB_TIMEOUT: ${{ vars.WEB_TIMEOUT || '330s' }}
  WEB_MIN_INSTANCES: ${{ vars.WEB_MIN_INSTANCES || '0' }}
  WEB_MAX_INSTANCES: ${{ vars.WEB_MAX_INSTANCES || '2' }}

  # Optional. Provider API keys live in Secret Manager and are mounted by reference, e.g.
  #   DEEPSEEK_API_KEY=deepseek-api-key:latest,MOONSHOT_API_KEY=moonshot-api-key:latest
  # (see docs/secrets.md). Empty leaves the service's existing secrets untouched.
  API_SECRETS: ${{ vars.API_SECRETS }}
  CHAT_MAX_GENERATION_SECONDS: ${{ vars.CHAT_MAX_GENERATION_SECONDS || '240' }}
  # Optional access policy and site-wide caps (see docs/cost-controls.md). Empty = leave unchanged.
  ACCESS_ALLOWED_EMAILS: ${{ vars.ACCESS_ALLOWED_EMAILS }}
  ACCESS_ALLOWED_EMAIL_DOMAINS: ${{ vars.ACCESS_ALLOWED_EMAIL_DOMAINS }}
  ACCESS_ALLOWED_UIDS: ${{ vars.ACCESS_ALLOWED_UIDS }}
  ACCESS_REQUIRE_VERIFIED_EMAIL: ${{ vars.ACCESS_REQUIRE_VERIFIED_EMAIL }}
  QUOTA_GLOBAL_DAILY_REQUEST_LIMIT: ${{ vars.QUOTA_GLOBAL_DAILY_REQUEST_LIMIT }}
  QUOTA_GLOBAL_DAILY_TOKEN_LIMIT: ${{ vars.QUOTA_GLOBAL_DAILY_TOKEN_LIMIT }}
  QUOTA_GLOBAL_DAILY_SEARCH_LIMIT: ${{ vars.QUOTA_GLOBAL_DAILY_SEARCH_LIMIT }}
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore VertexAI/VertexAI.csproj

      - name: Restore tests
        run: dotnet restore VertexAI.Tests/VertexAI.Tests.csproj

      - name: Build API
        run: dotnet build VertexAI/VertexAI.csproj --no-restore --disable-build-servers

      - name: Build tests
        run: dotnet build VertexAI.Tests/VertexAI.Tests.csproj --no-restore --disable-build-servers

      - name: Run service tests
        run: dotnet run --project VertexAI.Tests/VertexAI.Tests.csproj --no-build

      - name: Validate deployment configuration
        run: |
          required=(
            PROJECT_ID
            REGION
            REPOSITORY
            API_SERVICE
            WEB_SERVICE
            WIF_PROVIDER
            DEPLOY_SERVICE_ACCOUNT
            RUNTIME_SERVICE_ACCOUNT
            WEB_SERVICE_ACCOUNT
            WEB_INVOKER_SERVICE_ACCOUNT
            FIREBASE_PROJECT_ID
            FIRESTORE_PROJECT_ID
            FIREBASE_AUTH_DOMAIN
            FIREBASE_API_KEY
            FIREBASE_APP_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required deployment setting: ${name}"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repository
        run: |
          if ! gcloud artifacts repositories describe "${REPOSITORY}" \
            --project="${PROJECT_ID}" \
            --location="${REGION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${REPOSITORY}" \
              --project="${PROJECT_ID}" \
              --location="${REGION}" \
              --repository-format=docker \
              --description="Vertex AI workspace containers"
          fi

      - name: Ensure attachment storage bucket
        run: |
          if ! gcloud storage buckets describe "gs://${ATTACHMENT_STORAGE_BUCKET}" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${ATTACHMENT_STORAGE_BUCKET}" \
              --project="${PROJECT_ID}" \
              --location="${REGION}" \
              --uniform-bucket-level-access
          fi

          gcloud storage buckets add-iam-policy-binding "gs://${ATTACHMENT_STORAGE_BUCKET}" \
            --member="serviceAccount:${RUNTIME_SERVICE_ACCOUNT}" \
            --role="${ATTACHMENT_STORAGE_ROLE}" >/dev/null

      - name: Ensure Firestore indexes
        run: node scripts/deploy-firestore-indexes.mjs

      - name: Release (candidate, promote, smoke test, roll back on failure)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          source scripts/lib/cloud-run-release.sh
          crr_release
