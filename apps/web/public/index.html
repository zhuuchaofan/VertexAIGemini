<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>球球布丁工作室</title>
    <link rel="stylesheet" href="/styles.css?v=20261016c" />
  </head>
  <body>
    <main class="app-loading" id="app-loading" aria-live="polite" aria-busy="true">
      <div class="brand-mark">球</div>
      <div>
        <h1>球球布丁工作室</h1>
        <p>正在进入工作台...</p>
      </div>
    </main>

    <main class="auth-screen hidden" id="auth-screen">
      <section class="auth-card" aria-label="账户">
        <div class="auth-brand">
          <div class="brand-mark">球</div>
          <div>
            <h1>球球布丁工作室</h1>
            <p>登录后进入聊天工作台</p>
          </div>
        </div>

        <div class="segmented" role="tablist">
          <button id="login-tab" class="active" type="button">登录</button>
          <button id="register-tab" type="button">注册</button>
        </div>
        <form id="auth-form">
          <label>
            邮箱
            <input id="email" name="email" autocomplete="email" type="email" required />
          </label>
          <label>
            密码
            <input id="password" name="password" autocomplete="current-password" type="password" required />
          </label>
          <button id="auth-submit" class="primary" type="submit">登录</button>
        </form>
        <div class="auth-secondary-actions">
          <button id="google-login" class="provider-button" type="button">使用 Google 账号继续</button>
          <button id="forgot-password" class="link-button" type="button">忘记密码？</button>
        </div>
        <p id="auth-message" class="status-line"></p>
      </section>
    </main>

    <div class="workspace-shell hidden" id="workspace-shell">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="brand-block">
            <div class="brand-mark">球</div>
            <div>
              <h1>球球布丁工作室</h1>
              <p id="session-label">未登录</p>
            </div>
          </div>
          <button id="collapse-sidebar" class="icon-button" type="button" title="隐藏侧栏" aria-label="隐藏侧栏">
            ‹
          </button>
        </div>

        <button id="logout-button" class="ghost hidden" type="button">退出登录</button>
        <details class="settings-fold" id="settings-fold" open>
        <summary>会话设置</summary>
        <section class="workspace-settings" aria-label="会话设置">
          <label>
            提供商
            <select id="provider-select"></select>
          </label>
          <label>
            模型
            <select id="model-select"></select>
          </label>
          <div id="thinking-settings" class="thinking-settings hidden" aria-label="思考设置"></div>
          <label>
            提示词预设
            <select id="preset-select"></select>
          </label>
          <label id="custom-prompt-label" class="hidden">
            自定义提示词
            <textarea id="custom-prompt" rows="4" placeholder="输入本次会话的 system prompt"></textarea>
          </label>
          <label>
            搜索模式
            <select id="search-mode">
              <option value="auto">自动联网</option>
              <option value="off">关闭联网</option>
              <option value="force">强制查证</option>
            </select>
          </label>
          <details id="advanced-settings" class="settings-fold">
            <summary>高级设置</summary>
            <div class="workspace-settings">
              <label>
                内容过滤
                <select id="safety-threshold" disabled>
                  <option value="">跟随服务器策略</option>
                </select>
              </label>
              <p class="status-line" id="safety-status">登录后加载可用过滤级别。</p>
              <p class="status-line hidden" id="sampling-note">此模型忽略温度和 Top-P，请通过思考级别调整推理深度。</p>
              <label>
                温度（0–2）
                <input id="generation-temperature" type="number" min="0" max="2" step="0.1" placeholder="默认 1" />
              </label>
              <label>
                Top-P（大于 0，最多 1）
                <input id="generation-top-p" type="number" min="0.01" max="1" step="0.01" placeholder="默认 0.9" />
              </label>
              <label>
                最大输出 Token（1–65536）
                <input id="generation-max-tokens" type="number" min="1" max="65536" step="1" placeholder="默认 8192" />
              </label>
              <p class="status-line">仅用于 Gemini；实际输出上限受模型限制。设置在本浏览器保存，每次发送时生效。关闭可配置过滤不影响服务商的其他限制。</p>
              <button id="reset-advanced" type="button" class="ghost">恢复服务器默认</button>
            </div>
          </details>
        </section>
        </details>
        <button id="new-chat" class="primary" type="button">＋ 新对话</button>

        <section class="conversation-panel" aria-label="会话">
          <div class="panel-heading">
            <h2>会话</h2>
            <button id="refresh-conversations" class="icon-button" type="button" title="刷新会话">↻</button>
          </div>
          <div id="conversation-list" class="conversation-list"></div>
          <button id="load-more-conversations" class="ghost hidden" type="button">加载更多</button>
          <p id="conversation-empty" class="status-line">登录后显示历史会话</p>
        </section>
      </aside>

      <button
        id="sidebar-overlay"
        class="sidebar-overlay"
        type="button"
        aria-label="收起侧栏"
        tabindex="-1"
      ></button>

      <main class="chat-surface">
        <header class="chat-header">
          <div class="chat-title-row">
            <button id="expand-sidebar" class="icon-button sidebar-toggle-open" type="button" title="显示侧栏" aria-label="显示侧栏">
              ›
            </button>
            <div>
              <p class="eyebrow">Model-neutral API client</p>
              <h2>球球布丁工作室</h2>
            </div>
          </div>
          <div class="connection-state" id="connection-state">API 未连接</div>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>

        <form id="chat-form" class="composer">
          <div class="composer-main">
            <div id="attachment-preview" class="attachment-preview hidden"></div>
            <textarea
              id="message-input"
              rows="1"
              maxlength="10000"
              placeholder="输入消息"
            ></textarea>
          </div>
          <div class="composer-actions">
            <label class="attach-button" title="添加附件">
              <input
                id="image-input"
                type="file"
                accept="image/*,.pdf,.txt,.md,.markdown,.csv,.json,.xml,.yaml,.yml,.html,.css,.js,.ts,.tsx,.jsx,.cs,.py,.java,.go,.rs,.sql"
                multiple
              />
              <span>＋</span>
            </label>
            <button id="send-button" class="send-button" type="submit">发送</button>
          </div>
        </form>
      </main>
    </div>

    <template id="message-template">
      <article class="message">
        <div class="message-role"></div>
        <div class="message-attachments hidden"></div>
        <div class="message-content"></div>
        <details class="thinking hidden">
          <summary>思考过程</summary>
          <pre></pre>
        </details>
        <div class="citations hidden"></div>
      </article>
    </template>

    <script type="module" src="/app.js?v=20261016c"></script>
  </body>
</html>
